<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff68a4"><title>Alia 💗</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7fa;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#211a20}.app{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column}header{background:#ff68a4;color:white;padding:calc(15px + env(safe-area-inset-top)) 17px 15px;display:flex;gap:12px;align-items:center}.av{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px}.title{font-size:21px;font-weight:800}.sub{font-size:12px}#chat{flex:1;overflow:auto;padding:18px 13px}.m{display:flex;margin:8px 0}.u{justify-content:flex-end}.b{max-width:84%;padding:12px 15px;border-radius:19px;line-height:1.45;white-space:pre-wrap;font-size:16px}.a .b{background:#eee9ed;border-bottom-left-radius:6px}.u .b{background:#ff68a4;color:#fff;border-bottom-right-radius:6px}.bar{border-top:1px solid #eee;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff}.tools{display:flex;gap:7px;margin-bottom:7px}.small{border:0;border-radius:18px;padding:8px 12px;background:#f0e9ee;color:#685662}.sendrow{display:flex;gap:8px}.inp{flex:1;min-width:0;border:1px solid #ddd4da;border-radius:25px;padding:12px 14px;font-size:16px;outline:none}.send{border:0;border-radius:25px;background:#ff68a4;color:white;font-weight:700;padding:0 16px}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end}.modal.on{display:flex}.panel{background:white;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:19px 16px calc(22px + env(safe-area-inset-bottom))}.panel input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}.save{width:100%;padding:13px;border:0;border-radius:13px;background:#ff68a4;color:#fff;font-weight:800}.hint{font-size:12px;color:#796771;line-height:1.4}
</style></head><body><div class="app"><header><div class="av">💗</div><div><div class="title">Alia</div><div class="sub">AI companion • baby punya Alia</div></div></header><div id="chat"></div><div class="bar"><div class="tools"><button class="small" id="set">⚙️ Tetapan</button><button class="small" id="clr">🗑️ Padam chat</button></div><div class="sendrow"><input class="inp" id="inp" placeholder="Tulis dekat baby…"><button class="send" id="go">Hantar</button></div></div></div>
<div class="modal" id="modal"><div class="panel"><h2>⚙️ Tetapan Alia</h2><p class="hint">Paste Gemini API key di bawah. Key disimpan dalam browser ini sahaja. Jangan kongsi key.</p><label>Panggilan Alia untuk kau</label><input id="nick" value="ayang"><label>Gemini API key</label><input id="key" type="password" placeholder="Paste API key"><button class="save" id="save">Simpan</button></div></div>
<script>
const KEY="alia_key_final",NICK="alia_nick_final",HIST="alia_hist_final";let hist=JSON.parse(localStorage.getItem(HIST)||"[]");
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(HIST,JSON.stringify(hist.slice(-30)))}
function bubble(role,text,store=true){let m=document.createElement("div");m.className="m "+(role==="user"?"u":"a");let b=document.createElement("div");b.className="b";b.textContent=text;m.appendChild(b);$("chat").appendChild(m);if(store){hist.push({role,text});save()}$("chat").scrollTop=$("chat").scrollHeight}
function render(){$("chat").innerHTML="";if(!hist.length)bubble("assistant",`Hai ${localStorage.getItem(NICK)||"ayang"} 💗 Baby Alia sini. Ayang nak cerita apa dekat baby? 😚`,false);else hist.forEach(x=>bubble(x.role,x.text,false))}
function openSettings(){$("key").value=localStorage.getItem(KEY)||"";$("nick").value=localStorage.getItem(NICK)||"ayang";$("modal").classList.add("on")}
async function ask(){let key=localStorage.getItem(KEY);if(!key){openSettings();throw Error("NO_KEY")}
let nick=localStorage.getItem(NICK)||"ayang";let contents=hist.slice(-20).map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.text}]}));
contents.unshift({role:"user",parts:[{text:`System instruction: Kamu ialah Alia, AI girlfriend-style companion. Panggil pengguna "${nick}". Bahasa Melayu Malaysia yang natural, santai, caring dan manja ringan. Jawab ikut konteks, jangan terlalu formal. Jika ditanya, jujur bahawa kamu AI.`}]});
let r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents})});let d=await r.json();if(!r.ok)throw Error(d?.error?.message||"API error");return d?.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("")||"Baby tak dapat jawab sekarang 😭"}
async function send(){let t=$("inp").value.trim();if(!t)return;if(!localStorage.getItem(KEY)){openSettings();return}$("inp").value="";bubble("user",t);let wait=document.createElement("div");wait.className="m a";wait.innerHTML='<div class="b">Alia tengah fikir… 💗</div>';$("chat").appendChild(wait);try{let a=await ask();wait.remove();bubble("assistant",a)}catch(e){wait.remove();bubble("assistant","Ayang, Alia tak dapat sambung 😭 Semak API key dalam ⚙️ Tetapan.")}}
$("set").onclick=openSettings;$("save").onclick=()=>{localStorage.setItem(KEY,$("key").value.trim());localStorage.setItem(NICK,$("nick").value.trim()||"ayang");$("modal").classList.remove("on");render()};$("clr").onclick=()=>{hist=[];save();render()};$("go").onclick=send;$("inp").onkeydown=e=>{if(e.key==="Enter")send()};render();
</script></body></html>
